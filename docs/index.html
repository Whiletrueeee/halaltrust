<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halal Trust 清真合规餐饮地图</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="应用导航">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">حلال</div>
          <div>
            <strong>Halal Trust</strong>
            <span>清真合规餐饮地图</span>
          </div>
        </div>

        <nav class="nav-list">
          <button class="nav-item active" data-view="restaurants" type="button">
            <span class="nav-icon">⌖</span>
            餐厅目录
          </button>
          <button class="nav-item" data-view="sources" type="button">
            <span class="nav-icon">✓</span>
            肉源核验
          </button>
          <button class="nav-item" data-view="slaughterhouses" type="button">
            <span class="nav-icon">▦</span>
            屠宰场
          </button>
          <button class="nav-item" data-view="admin" type="button">
            <span class="nav-icon">＋</span>
            管理员
          </button>
        </nav>

        <div class="audit-panel">
          <span>本地原型状态</span>
          <strong id="apiStatus">连接中</strong>
          <p>接口已预留给真实数据库、认证机构、地图服务和小程序定位能力。</p>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">面向差旅、社区与家庭就餐</p>
            <h1>可信清真餐饮与合规肉源查询</h1>
          </div>
          <div class="top-actions">
            <div class="location-control">
              <label class="location-search" aria-label="查询定位点">
                <input id="locationInput" type="search" placeholder="输入定位点，如兰州西固区" />
                <button class="ghost-action" id="locationSearchButton" type="button">定位查询</button>
              </label>
              <div class="location-status" id="locationStatus">当前定位：待定位</div>
            </div>
            <button class="primary-action" id="locateButton" type="button">附近查询</button>
          </div>
        </header>

        <section class="search-band" aria-label="搜索和筛选">
          <label class="search-box">
            <span>搜索</span>
            <input id="searchInput" type="search" placeholder="餐厅、商圈、菜系、肉源关键词" />
          </label>

          <div class="filters">
            <label>
              省份
              <select id="provinceSelect"></select>
            </label>
            <label>
              城市
              <select id="citySelect" aria-label="选择城市"></select>
            </label>
            <label>
              行政区
              <select id="districtSelect"></select>
            </label>
            <label>
              合规级别
              <select id="certSelect"></select>
            </label>
            <label>
              来源类型
              <select id="sourceTypeSelect"></select>
            </label>
            <label>
              菜系
              <select id="cuisineSelect"></select>
            </label>
          </div>
        </section>

        <section class="stats-strip" aria-label="目录概况">
          <div>
            <span id="restaurantCount">0</span>
            <p>合规餐厅</p>
          </div>
          <div>
            <span id="sourceCount">0</span>
            <p>肉源记录</p>
          </div>
          <div>
            <span id="slaughterhouseCount">0</span>
            <p>屠宰场档案</p>
          </div>
        </section>

        <div class="content-grid">
          <section class="results-area" aria-live="polite">
            <div class="section-heading">
              <div>
                <p id="viewKicker">餐厅目录</p>
                <h2 id="viewTitle">附近清真餐厅</h2>
              </div>
              <span id="resultTotal">0 家</span>
            </div>
            <div id="resultsList" class="results-list"></div>
          </section>

          <section class="admin-area" id="adminArea" hidden>
            <div class="section-heading">
              <div>
                <p>管理员</p>
                <h2 id="adminFormTitle">新增主页餐厅条目</h2>
              </div>
              <button class="ghost-action" id="resetFormButton" type="button">清空表单</button>
            </div>

            <div class="admin-tabs" role="tablist" aria-label="管理员数据类型">
              <button class="admin-tab active" data-admin-type="restaurants" type="button">餐厅条目</button>
              <button class="admin-tab" data-admin-type="sources" type="button">肉源核验</button>
              <button class="admin-tab" data-admin-type="slaughterhouses" type="button">屠宰场</button>
            </div>
            <div class="admin-status" id="adminMessage" role="status"></div>

            <form class="admin-form" id="restaurantForm" data-admin-form="restaurants">
              <input type="hidden" name="id" />
              <input type="hidden" name="coverImage" />
              <input type="hidden" name="environmentPhotos" />
              <input type="hidden" name="certificatePhotos" />
              <input type="hidden" name="menu" />
              <label>
                餐厅名称
                <input name="name" required placeholder="例如：月牙泉清真铜锅" />
              </label>
              <label>
                省份
                <select name="province" data-admin-province="restaurants"></select>
              </label>
              <label>
                城市
                <select name="city" required data-admin-city="restaurants"></select>
              </label>
              <label>
                区域
                <select name="district" required data-admin-district="restaurants"></select>
              </label>
              <label class="wide">
                详细地址
                <input name="address" required placeholder="街道、商圈、楼层" />
              </label>
              <label>
                联系电话
                <input name="phone" placeholder="例如：010-88886666" />
              </label>
              <label>
                菜系
                <input name="cuisine" placeholder="新疆菜 / 兰州牛肉面" />
              </label>
              <label>
                人均价格
                <input name="avgPrice" type="number" min="0" step="1" placeholder="68" />
              </label>
              <label>
                评分
                <input name="rating" type="number" min="0" max="5" step="0.1" placeholder="4.7" />
              </label>
              <label>
                营业状态
                <select name="openNow">
                  <option value="true">营业中</option>
                  <option value="false">休息中</option>
                </select>
              </label>
              <label>
                合规级别
                <select name="certificationLevel" id="adminCertSelect"></select>
              </label>
              <label>
                来源类型
                <select name="sourceType" id="adminSourceTypeSelect"></select>
              </label>
              <label>
                肉源记录
                <select name="sourceId" id="adminSourceSelect"></select>
              </label>
              <label class="wide">
                简介
                <textarea name="summary" required rows="3" placeholder="描述合规来源、适合场景、特色菜等"></textarea>
              </label>
              <label class="wide">
                菜单
              </label>
              <div class="menu-editor wide" data-menu-editor="restaurants"></div>
              <button class="ghost-action wide menu-add-button" data-menu-add="restaurants" type="button">添加菜品</button>
              <label class="wide">
                标签
                <input name="tags" placeholder="用逗号分隔，例如：独立清真厨房, 可查票据, 包间" />
              </label>
              <label class="wide">
                封面图片
                <input name="coverFile" type="file" accept="image/*" />
              </label>
              <div class="cover-preview wide" data-cover-preview="restaurants"></div>
              <label class="wide">
                环境相册
                <input name="environmentFiles" type="file" accept="image/*" multiple data-max-files="20" />
              </label>
              <div class="gallery-preview wide" data-gallery-preview="restaurants-environment"></div>
              <label class="wide">
                营业证书相册
                <input name="certificateFiles" type="file" accept="image/*" multiple data-max-files="20" />
              </label>
              <div class="gallery-preview wide" data-gallery-preview="restaurants-certificate"></div>
              <div class="form-actions wide">
                <button class="primary-action" type="submit">保存条目</button>
              </div>
            </form>

            <form class="admin-form" id="sourceForm" data-admin-form="sources" hidden>
              <input type="hidden" name="id" />
              <input type="hidden" name="coverImage" />
              <input type="hidden" name="environmentPhotos" />
              <input type="hidden" name="certificatePhotos" />
              <label>
                肉源名称
                <input name="name" required placeholder="例如：京北清真肉类供应链" />
              </label>
              <label>
                省份
                <select name="province" data-admin-province="sources"></select>
              </label>
              <label>
                城市
                <select name="city" required data-admin-city="sources"></select>
              </label>
              <label>
                区域
                <select name="district" data-admin-district="sources"></select>
              </label>
              <label class="wide">
                地址
                <input name="address" placeholder="供应链仓库、配送中心或备案地址" />
              </label>
              <label>
                联系电话
                <input name="phone" placeholder="例如：400-888-0000" />
              </label>
              <label>
                来源类型
                <select name="sourceType" id="sourceFormTypeSelect"></select>
              </label>
              <label>
                认证 / 核验机构
                <input name="certifier" required placeholder="例如：地方清真食品监督记录" />
              </label>
              <label>
                证书编号
                <input name="certificateNo" required placeholder="例如：BJ-HALAL-2026-018" />
              </label>
              <label>
                有效期至
                <input name="validUntil" type="date" required />
              </label>
              <label class="wide">
                追溯说明
                <textarea name="traceability" required rows="4" placeholder="描述屠宰、冷链、入库、餐厅签收等记录"></textarea>
              </label>
              <label class="wide">
                服务 / 菜单项
                <textarea name="menu" rows="3" placeholder="一行一个，例如：牛肉冷链配送&#10;羊肉批次追溯&#10;餐厅签收记录"></textarea>
              </label>
              <label class="wide">
                封面图片
                <input name="coverFile" type="file" accept="image/*" />
              </label>
              <div class="cover-preview wide" data-cover-preview="sources"></div>
              <label class="wide">
                环境相册
                <input name="environmentFiles" type="file" accept="image/*" multiple data-max-files="20" />
              </label>
              <div class="gallery-preview wide" data-gallery-preview="sources-environment"></div>
              <label class="wide">
                营业证书相册
                <input name="certificateFiles" type="file" accept="image/*" multiple data-max-files="20" />
              </label>
              <div class="gallery-preview wide" data-gallery-preview="sources-certificate"></div>
              <div class="form-actions wide">
                <button class="primary-action" type="submit">保存肉源</button>
              </div>
            </form>

            <form class="admin-form" id="slaughterhouseForm" data-admin-form="slaughterhouses" hidden>
              <input type="hidden" name="id" />
              <input type="hidden" name="coverImage" />
              <input type="hidden" name="environmentPhotos" />
              <input type="hidden" name="certificatePhotos" />
              <label>
                屠宰场名称
                <input name="name" required placeholder="例如：北京顺义清真屠宰点" />
              </label>
              <label>
                省份
                <select name="province" data-admin-province="slaughterhouses"></select>
              </label>
              <label>
                城市
                <select name="city" required data-admin-city="slaughterhouses"></select>
              </label>
              <label>
                区域
                <select name="district" required data-admin-district="slaughterhouses"></select>
              </label>
              <label>
                状态
                <select name="status">
                  <option value="合规">合规</option>
                  <option value="待复审">待复审</option>
                  <option value="暂停展示">暂停展示</option>
                </select>
              </label>
              <label class="wide">
                地址
                <input name="address" required placeholder="详细地址或园区位置" />
              </label>
              <label>
                联系电话
                <input name="phone" placeholder="例如：029-88889999" />
              </label>
              <label>
                审核人员 / 机构
                <input name="auditor" required placeholder="例如：清真食品监督员 A" />
              </label>
              <label>
                最近审核日期
                <input name="lastAudit" type="date" required />
              </label>
              <label class="wide">
                合规要求
                <input name="requirements" placeholder="用逗号分隔，例如：穆斯林屠宰员, 独立刀具, 独立冷链" />
              </label>
              <label class="wide">
                简介
                <textarea name="summary" rows="3" placeholder="描述屠宰场能力、合规流程和服务范围"></textarea>
              </label>
              <label class="wide">
                服务 / 菜单项
                <textarea name="menu" rows="3" placeholder="一行一个，例如：牛羊肉合规屠宰&#10;冷链封签配送&#10;批次追溯记录"></textarea>
              </label>
              <label class="wide">
                封面图片
                <input name="coverFile" type="file" accept="image/*" />
              </label>
              <div class="cover-preview wide" data-cover-preview="slaughterhouses"></div>
              <label class="wide">
                环境相册
                <input name="environmentFiles" type="file" accept="image/*" multiple data-max-files="20" />
              </label>
              <div class="gallery-preview wide" data-gallery-preview="slaughterhouses-environment"></div>
              <label class="wide">
                营业证书相册
                <input name="certificateFiles" type="file" accept="image/*" multiple data-max-files="20" />
              </label>
              <div class="gallery-preview wide" data-gallery-preview="slaughterhouses-certificate"></div>
              <div class="form-actions wide">
                <button class="primary-action" type="submit">保存屠宰场</button>
              </div>
            </form>
          </section>

          <aside class="map-pane" aria-label="地图分布">
            <div class="map-toolbar">
              <strong>区域缩略图</strong>
              <select id="mapProvider" aria-label="导航地图">
                <option value="amap">高德</option>
                <option value="baidu">百度</option>
                <option value="google">Google</option>
              </select>
            </div>
            <div class="map-canvas" id="mapCanvas"></div>
            <div class="detail-panel" id="detailPanel">
              <p>选择一家餐厅查看合规来源、证照状态和导航入口。</p>
            </div>
          </aside>
        </div>
      </main>
    </div>

    <script src="map-config.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
